<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Miuix Canvas renderer</title>
    <link rel="preconnect" href="https://cdn-font.hyperos.mi.com" />
    <link rel="preconnect" href="https://cdn-file.hyperos.mi.com" crossorigin />
    <link rel="stylesheet" href="renderer.css" />
    <script type="application/javascript">
      function report(message) {
        try {
          window.parent.postMessage(JSON.stringify({ type: "error", message: String(message) }), window.location.origin);
        } catch (error) {}
      }
      window.addEventListener("error", function (event) {
        report(event.message || event.error || "Renderer script failed");
      });
      window.addEventListener("unhandledrejection", function (event) {
        report(event.reason || "Renderer promise failed");
      });
    </script>
  </head>
  <body>
    <div id="ComposeTarget"></div>
    <script src="miuixRenderer.js" type="module"></script>
  </body>
</html>
